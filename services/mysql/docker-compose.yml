networks:
  local_network:
    name: local_network
    external: true

services:
  mysql:
    image: mysql:8
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    volumes:
      - ./imports:/imports:rw
      - mysql_data:/var/lib/mysql
    networks:
      - local_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: mysql_data
    driver: local
