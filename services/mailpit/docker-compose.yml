version: '3.9'

networks:
  local_network:
    external: true
    name: local_network

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    networks:
      - local_network
    expose:
      - "1025"
      - "8025"
    environment:
      - MP_HOSTNAME=mailpit.homelab
      - MP_MAX_MESSAGES=5000
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:
    driver: local
