services:
  redis:
    image: redis:alpine
    container_name: redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - local_network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  local_network:

volumes:
  redis-data:
    driver: local
