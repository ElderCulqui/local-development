networks:
  local_network:
    name: local_network
    external: true

services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: local_proxy
    restart: always
    ports:
      - "100.66.71.24:80:80"
      - "100.66.71.24:443:443"
      - "100.66.71.24:81:81"
    volumes:
      - npm_data:/data
      - npm_certs:/etc/letsencrypt
    networks:
      - local_network
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - local_network

volumes:
  npm_data:
  npm_certs:
  adguard_work:
  adguard_conf:
