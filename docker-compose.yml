version: '3.9'

networks:
  local_network:
    name: local_network
    external: true

services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: local_proxy
    restart: always
    ports:
      - "100.66.71.24:80:80"
      - "100.66.71.24:443:443"
      - "100.66.71.24:81:81"
    volumes:
      - npm_data:/data
      - npm_certs:/etc/letsencrypt
    networks:
      - local_network
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: always
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - local_network
  mysql:
    platform: linux/x86_64
    image: mysql:8
    container_name: local_db
    restart: on-failure
    working_dir: /app
    tty: true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    volumes:
      - ./data:/app:rw
      - local_db_data:/var/lib/mysql
    networks:
      - local_network

volumes:
  local_db_data:
    driver: local
  npm_data:
  npm_certs:
  adguard_work:
  adguard_conf:
